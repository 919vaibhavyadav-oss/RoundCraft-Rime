# Two services from one image.
#
# The agent is a background worker: it connects out to LiveKit and waits to be
# assigned a room, so it serves no inbound traffic and needs no domain. The
# interface is an ordinary web service that serves the page and mints the join
# token, which is what keeps the LiveKit secret out of the browser.
#
# Every credential is set in the Render dashboard and none are committed. The
# non-secret values are pinned here on purpose: each was chosen for a reason
# recorded in README.md, and a deployment that quietly differed from the demo
# would be the exact class of failure this project spent the day fixing.
services:
  - type: worker
    name: roundcraft-rime-agent
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: starter
    envVars:
      - key: RIME_API_KEY
        sync: false
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      - key: DEEPGRAM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        sync: false
      - key: RIME_MODEL
        value: coda
      - key: RIME_LANG
        value: eng
      # 48kHz throughout, matching what LiveKit rooms carry. Anything else adds
      # a resampler, and two resamplers starting together abort the process.
      - key: RIME_SAMPLE_RATE
        value: "48000"
      - key: DEEPGRAM_SAMPLE_RATE
        value: "48000"
      # Free model tiers reject a request whose output *budget* exceeds their
      # per-minute cap, before generating anything. An interview question is
      # about thirty tokens.
      - key: LLM_MAX_TOKENS
        value: "150"
      - key: LLM_REASONING_EFFORT
        value: none
      # The fixed delay the candidate is meant to interrupt.
      - key: LOOKUP_DELAY_SECONDS
        value: "3.0"

  - type: web
    name: roundcraft-rime-web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerCommand: python scripts/serve_web.py
    plan: starter
    healthCheckPath: /api/panel
    envVars:
      # Only what is needed to mint a room token. The Rime, Deepgram and model
      # credentials belong to the worker and are deliberately absent here.
      - key: LIVEKIT_URL
        sync: false
      - key: LIVEKIT_API_KEY
        sync: false
      - key: LIVEKIT_API_SECRET
        sync: false
      # Required. Starting an interview spends money at three providers, so the
      # server refuses to come up on a public URL without a code to gate it.
      # Declared here so the blueprint asks for it rather than failing the first
      # deploy with a message only the logs carry.
      - key: ACCESS_CODE
        sync: false
