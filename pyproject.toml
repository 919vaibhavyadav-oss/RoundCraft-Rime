[project]
name = "roundcraft-rime"
version = "0.1.0"
description = "An AI interview panel that shares one voice session, with Rime as the primary spoken output."
requires-python = ">=3.12"
dependencies = [
  # The openai extra supplies the OpenAI-compatible LLM client, which is how we
  # talk to Groq. Rime is the text-to-speech and the reason this project exists.
  "livekit-agents[deepgram,openai,rime,silero,turn-detector]>=1.0,<2",
  "pydantic-settings>=2.10,<3",
  "httpx>=0.28,<1",
  "python-dotenv>=1.0,<2",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.17,<2",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  # Used by the tests that read render.yaml, so a drifting deployment
  # setting fails a build rather than a demo.
  "pyyaml>=6.0,<7",
  "types-PyYAML>=6.0,<7",
  "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 110
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unreachable = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
